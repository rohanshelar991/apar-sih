name: Verify and deploy
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Disposable H2 unit tests and PostgreSQL 16 Testcontainers only.
      # Never inject Supabase credentials into this job.
      - run: mvn -B -ntp -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/*.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env:
          # Compile-only URL. Deployment rebuilds using the real Vercel variable.
          VITE_API_BASE_URL: https://backend.example.invalid/api
      - run: git diff --check

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment inputs
        shell: bash
        run: |
          for name in RENDER_API_KEY RENDER_SERVICE_ID RENDER_BACKEND_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then echo "Missing deployment setting: $name"; exit 1; fi
          done
      - name: Deploy the checked commit to Render and wait for health
        run: python3 .github/scripts/deploy_render.py
      - run: npm install --global vercel@65.9.0
      # Vercel project Root Directory must be frontend; CLI runs at repo root.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
