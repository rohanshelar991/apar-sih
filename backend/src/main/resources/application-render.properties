# Activate together with postgres. Startup guard enforces this combination.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
apaar.seed-demo-data=false
apaar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.jpa.show-sql=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.tomcat.accesslog.enabled=false
logging.level.root=WARN
logging.level.com.infobro.apaar.ApaarConnectApplication=INFO
logging.level.org.flywaydb.core.internal.command.DbValidate=INFO
logging.level.org.flywaydb.core.internal.command.DbMigrate=INFO
logging.level.org.springframework.orm.jpa.LocalContainerEntityManagerFactoryBean=INFO
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.web=ERROR
