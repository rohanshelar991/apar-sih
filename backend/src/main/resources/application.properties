server.port=8080
server.servlet.context-path=/

# In-memory H2 database in PostgreSQL compatibility mode for instant 1-command zero-setup run
spring.datasource.url=jdbc:h2:mem:apaardb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate configuration
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Multipart file upload limits for bulk CSV
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# JWT security settings
apaar.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
apaar.jwt.expiration-ms=86400000

# Swagger OpenAPI docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# Simulated APAAR Adapter configuration
apaar.adapter.simulation-delay-ms=50
apaar.adapter.unknown-apaar-prefix=9999
