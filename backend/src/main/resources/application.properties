server.port=8080
server.servlet.context-path=/

# JPA / Hibernate configuration
spring.flyway.enabled=true
spring.profiles.default=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
apaar.seed-demo-data=${SEED_DEMO_DATA:false}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Multipart file upload limits for bulk CSV
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# JWT security settings
apaar.jwt.secret=${JWT_SECRET}
apaar.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:1440}
apaar.verify-token.ttl-minutes=${VERIFY_TOKEN_TTL_MINUTES:4320}
apaar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger OpenAPI docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# Simulated APAAR Adapter configuration
apaar.adapter.simulation-delay-ms=50
apaar.adapter.unknown-apaar-prefix=9999
