services:
  postgres:
    image: postgres:16-alpine
    container_name: apaar-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apaar_connect}
      POSTGRES_USER: ${POSTGRES_USER:-apaar_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
