services:
  - type: web
    name: apaar-garuda-netra-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres,render
      - key: SEED_DEMO_DATA
        value: "false"
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_POOL_MIN_IDLE
        value: "2"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: DB_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        value: hxmlezblzvdbacebsmcb
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FLYWAY_USER
        sync: false
      - key: FLYWAY_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VERIFY_TOKEN_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
